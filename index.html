<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashwagandha 3D | Pharmacognosy Heritage</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Premium Pharmacognosy / Botanical Heritage -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Playfair+Display:wght@400;500;600;700;800&family=DM+Serif+Display&family=Bricolage+Grotesque:wght@400;500;600;700;800&family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            /* Pharmacognosy / Botanical Heritage Palette */
            --forest-deep: #0F4C2A;
            --forest-classic: #1B5E20;
            --forest-mid: #1F6E3D;
            --green-soft: #2E8B4A;
            --green-leaf: #4CAF50;
            --mint-light: #E8F5E9;
            --gold-royal: #C9952A;
            --gold-warm: #E6B23A;
            --gold-bright: #FFD66B;
            --cream: #FBF6EC;
            --cream-deep: #F4ECD8;
            --maroon: #6B1F2A;
            --maroon-soft: #8C2A36;
            --ink: #1A2E1F;

            /* Glass tokens (warm cream tint) */
            --glass-bg: rgba(255, 250, 235, 0.55);
            --glass-bg-strong: rgba(255, 250, 235, 0.78);
            --glass-border: rgba(201, 149, 42, 0.35);
            --glass-shadow: 0 14px 34px rgba(15, 76, 42, 0.22);
        }

        html, body {
            font-family: 'Manrope', 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            color: var(--ink);
        }

        /* Typography roles */
        .font-cinzel    { font-family: 'Cinzel', serif; letter-spacing: 0.04em; }
        .font-fraunces  { font-family: 'Fraunces', serif; font-optical-sizing: auto; }
        .font-playfair  { font-family: 'Playfair Display', serif; }
        .font-dm-serif  { font-family: 'DM Serif Display', serif; }
        .font-bricolage { font-family: 'Bricolage Grotesque', sans-serif; }
        .font-syne      { font-family: 'Syne', sans-serif; }
        .font-outfit    { font-family: 'Outfit', sans-serif; }
        .font-manrope   { font-family: 'Manrope', sans-serif; }
        .font-space     { font-family: 'Space Grotesk', sans-serif; }

        model-viewer::part(default-progress-bar) { display: none; }

        /* ===== Parchment / Botanical Background ===== */
        .app-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 12% 18%, rgba(46, 139, 74, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 88% 22%, rgba(201, 149, 42, 0.20) 0%, transparent 45%),
                radial-gradient(circle at 78% 82%, rgba(15, 76, 42, 0.18) 0%, transparent 50%),
                radial-gradient(circle at 18% 88%, rgba(230, 178, 58, 0.16) 0%, transparent 45%),
                linear-gradient(135deg, #FBF6EC 0%, #F4ECD8 100%);
        }
        /* Subtle paper grain */
        .app-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(0deg, rgba(107, 31, 42, 0.025) 0 1px, transparent 1px 3px),
                repeating-linear-gradient(90deg, rgba(15, 76, 42, 0.02) 0 1px, transparent 1px 3px);
            pointer-events: none;
            mix-blend-mode: multiply;
        }

        .floating-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(80px);
            opacity: 0.45;
            animation: orbFloat 14s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 340px; height: 340px; background: #2E8B4A; top: 4%; left: -90px; animation-delay: 0s; }
        .orb-2 { width: 280px; height: 280px; background: #E6B23A; top: 28%; right: -70px; animation-delay: -5s; }
        .orb-3 { width: 240px; height: 240px; background: #0F4C2A; bottom: 6%; left: 28%; animation-delay: -8s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(40px,-30px) scale(1.12); }
        }

        /* ===== GLASSMORPHISM (cream / herbal tint) ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 14px 34px rgba(15, 76, 42, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.65);
            border-radius: 22px;
        }
        .glass-strong {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(201, 149, 42, 0.45);
            box-shadow:
                0 16px 40px rgba(15, 76, 42, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border-radius: 22px;
        }

        /* ===== Header (forest green with gold accents) ===== */
        .glass-header {
            background:
                linear-gradient(135deg, rgba(15, 76, 42, 0.96) 0%, rgba(31, 110, 61, 0.96) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-bottom: 1px solid rgba(201, 149, 42, 0.55);
            box-shadow:
                0 6px 28px rgba(15, 76, 42, 0.35),
                inset 0 1px 0 rgba(255, 214, 107, 0.25);
            position: relative;
            overflow: hidden;
        }
        .glass-header::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255, 214, 107, 0.18) 0%, transparent 40%),
                radial-gradient(circle at 80% 50%, rgba(201, 149, 42, 0.16) 0%, transparent 45%);
            pointer-events: none;
        }
        /* Decorative gold border line */
        .glass-header::after {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                #C9952A 20%,
                #FFD66B 50%,
                #C9952A 80%,
                transparent 100%);
            opacity: 0.85;
        }

        .header-eyebrow {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: 0.32em;
            color: #FFD66B;
            text-transform: uppercase;
        }
        .header-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #FBF6EC;
            text-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        .header-sub {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            letter-spacing: 0.18em;
            color: rgba(232, 245, 233, 0.78);
            text-transform: uppercase;
        }

        /* ===== Botanical Profile Frame (gold conic + laurel) ===== */
        .profile-wrap {
            position: relative;
            border-radius: 9999px;
            padding: 4px;
            background: conic-gradient(from 0deg,
                #C9952A, #FFD66B, #E6B23A, #C9952A, #8C6914, #FFD66B, #C9952A);
            box-shadow:
                0 0 0 1px rgba(255, 214, 107, 0.5),
                0 0 24px rgba(255, 214, 107, 0.55),
                0 0 40px rgba(201, 149, 42, 0.45),
                0 10px 30px rgba(15, 76, 42, 0.45);
            animation: ringSpin 10s linear infinite;
        }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        .profile-wrap img {
            display: block;
            border-radius: 9999px;
            background: var(--cream);
            animation: ringSpinReverse 10s linear infinite;
            border: 3px solid var(--cream);
            box-shadow: inset 0 0 0 2px rgba(15, 76, 42, 0.15);
        }
        @keyframes ringSpinReverse { to { transform: rotate(-360deg); } }

        /* Premium gold badge (e.g., scholar pin) */
        .gold-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 9999px;
            background: linear-gradient(135deg, #FFD66B 0%, #E6B23A 50%, #C9952A 100%);
            color: #4a2e08;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            box-shadow:
                0 4px 12px rgba(201, 149, 42, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.6),
                inset 0 -1px 0 rgba(110, 70, 0, 0.25);
            border: 1px solid rgba(255, 214, 107, 0.7);
        }

        /* ===== Splash Screen (parchment + botanical) ===== */
        .splash-bg {
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 250, 235, 1) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(244, 236, 216, 1) 0%, transparent 50%),
                linear-gradient(135deg, #FBF6EC 0%, #F0E6CD 100%);
        }
        .blob {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            opacity: 0.5;
            animation: blobFloat 9s ease-in-out infinite;
        }
        .blob-1 { width: 280px; height: 280px; background: #2E8B4A; top: 8%; left: -60px; animation-delay: 0s; }
        .blob-2 { width: 230px; height: 230px; background: #E6B23A; bottom: 10%; right: -40px; animation-delay: -3s; }
        .blob-3 { width: 200px; height: 200px; background: #0F4C2A; top: 45%; left: 50%; animation-delay: -5s; }
        @keyframes blobFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(30px,-20px) scale(1.1); }
        }

        .splash-emblem {
            animation: emblemFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 12px 28px rgba(15, 76, 42, 0.35));
        }
        @keyframes emblemFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
        }

        .emblem-disc {
            background:
                radial-gradient(circle at 30% 25%, #FFD66B 0%, #E6B23A 40%, #C9952A 100%);
            box-shadow:
                inset 0 2px 4px rgba(255, 255, 255, 0.6),
                inset 0 -3px 8px rgba(110, 70, 0, 0.35),
                0 12px 30px rgba(201, 149, 42, 0.45);
            border: 2px solid #FFD66B;
        }

        .progress-track {
            background: rgba(15, 76, 42, 0.10);
            box-shadow: inset 0 1px 2px rgba(15, 76, 42, 0.18);
        }
        .progress-fill {
            background: linear-gradient(90deg, #C9952A 0%, #FFD66B 50%, #C9952A 100%);
            background-size: 200% 100%;
            animation: shimmer 1.8s linear infinite;
            box-shadow: 0 0 12px rgba(255, 214, 107, 0.6);
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .dot-loader span {
            display: inline-block;
            width: 6px; height: 6px; margin: 0 2px;
            background: var(--forest-deep);
            border-radius: 9999px;
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .dot-loader span:nth-child(2) { animation-delay: 0.15s; }
        .dot-loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== Floating Botanical Icon Buttons ===== */
        .icon-btn {
            width: 58px; height: 58px;
            background: rgba(251, 246, 236, 0.65);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1px solid rgba(201, 149, 42, 0.45);
            box-shadow:
                0 10px 26px rgba(15, 76, 42, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.85),
                inset 0 -1px 0 rgba(201, 149, 42, 0.12);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--forest-deep);
            position: relative;
        }
        .icon-btn:hover {
            transform: scale(1.08) translateY(-2px);
            background: rgba(255, 250, 235, 0.85);
            border-color: var(--gold-royal);
            box-shadow:
                0 14px 32px rgba(15, 76, 42, 0.3),
                0 0 0 4px rgba(255, 214, 107, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .icon-btn:active { transform: scale(0.94); }
        .icon-btn.active {
            background: linear-gradient(135deg, #0F4C2A 0%, #1F6E3D 100%);
            color: #FFD66B;
            border: 1px solid rgba(255, 214, 107, 0.55);
            box-shadow:
                0 10px 26px rgba(15, 76, 42, 0.45),
                0 0 0 4px rgba(255, 214, 107, 0.30),
                inset 0 1px 0 rgba(255, 214, 107, 0.30);
        }
        .icon-btn .label {
            position: absolute;
            bottom: -22px;
            font-size: 9.5px;
            font-weight: 700;
            color: var(--forest-deep);
            letter-spacing: 0.18em;
            white-space: nowrap;
            opacity: 0.9;
            text-transform: uppercase;
            font-family: 'Space Grotesk', sans-serif;
        }

        .spin-once { animation: spinOnce 0.6s ease-out; }
        @keyframes spinOnce {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Tutorial pulse */
        .touch-indicator {
            box-shadow: 0 0 0 0 rgba(15, 76, 42, 0.4);
            animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(15, 76, 42, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 12px rgba(15, 76, 42, 0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(15, 76, 42, 0); }
        }
        @keyframes swipeAnim {
            0% { transform: translateX(-20px); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(-20px); }
        }
        .anim-swipe { animation: swipeAnim 2.5s ease-in-out infinite; }

        /* Model stage – soft botanical vignette */
        .model-stage {
            background:
                radial-gradient(ellipse at center 70%, rgba(15, 76, 42, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at center 90%, rgba(15, 76, 42, 0.14) 0%, transparent 50%);
        }

        /* Botanical specimen tag (taxonomy chip) */
        .specimen-tag {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 18px;
            background: rgba(251, 246, 236, 0.78);
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            border: 1px solid rgba(201, 149, 42, 0.5);
            border-radius: 9999px;
            box-shadow:
                0 8px 22px rgba(15, 76, 42, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 20;
        }
        .specimen-tag .latin {
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 500;
            color: var(--maroon);
            font-size: 13px;
            letter-spacing: 0.01em;
        }
        .specimen-tag .dot {
            width: 5px; height: 5px;
            background: var(--gold-royal);
            border-radius: 9999px;
            box-shadow: 0 0 8px var(--gold-warm);
        }
        .specimen-tag .common {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 10px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--forest-deep);
        }

        /* Footer (forest green parchment) */
        .glass-footer {
            background:
                linear-gradient(135deg, rgba(15, 76, 42, 0.94) 0%, rgba(27, 94, 32, 0.94) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 1px solid rgba(201, 149, 42, 0.55);
            box-shadow:
                0 -6px 24px rgba(15, 76, 42, 0.3),
                inset 0 1px 0 rgba(255, 214, 107, 0.18);
            position: relative;
        }
        .glass-footer::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg,
                transparent 0%,
                #C9952A 30%,
                #FFD66B 50%,
                #C9952A 70%,
                transparent 100%);
        }
        .footer-label {
            font-family: 'Cinzel', serif;
            font-weight: 600;
            letter-spacing: 0.28em;
            color: #FFD66B;
            text-transform: uppercase;
        }
        .footer-version {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            letter-spacing: 0.10em;
            color: rgba(232, 245, 233, 0.85);
        }

        /* Decorative laurel divider */
        .laurel-divider {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--gold-warm);
        }
        .laurel-divider::before,
        .laurel-divider::after {
            content: '';
            display: inline-block;
            width: 28px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-royal), transparent);
        }
    </style>
</head>
<body class="overflow-hidden selection:bg-amber-200/60" style="color: var(--ink);">

    <!-- Botanical parchment background -->
    <div class="app-bg" aria-hidden="true">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
    </div>

    <!-- ===== Splash Screen ===== -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center splash-bg transition-opacity duration-700 overflow-hidden">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="relative z-10 flex flex-col items-center px-6">
            <!-- Gold botanical emblem -->
            <div class="splash-emblem mb-6">
                <div class="emblem-disc w-24 h-24 rounded-full flex items-center justify-center relative">
                    <!-- Leaf monogram -->
                    <svg class="w-12 h-12" viewBox="0 0 24 24" fill="none" stroke="#0F4C2A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2C8 6 5 10 5 14a7 7 0 0014 0c0-4-3-8-7-12z"/>
                        <path d="M12 14v8"/>
                        <path d="M9 11c1 1 2 1.5 3 1.5S14 12 15 11"/>
                    </svg>
                </div>
            </div>

            <span class="gold-badge mb-4">
                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.39 7.36H22l-6.18 4.49L18.21 22 12 17.27 5.79 22l2.39-8.15L2 9.36h7.61z"/></svg>
                Pharmacognosy · Heritage
            </span>

            <h1 class="font-playfair text-4xl md:text-5xl mb-2 font-bold tracking-tight" style="color: var(--forest-deep);">Ashwagandha 3D</h1>

            <div class="laurel-divider mb-3">
                <span class="font-cinzel text-[11px] tracking-[0.4em]" style="color: var(--maroon);">WITHANIA SOMNIFERA</span>
            </div>

            <p class="font-space text-[11px] font-semibold tracking-[0.32em] uppercase mb-9" style="color: var(--forest-mid);">Explore · Rotate · Discover</p>

            <div class="w-72 h-[3px] progress-track rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full progress-fill rounded-full" style="width:0%"></div>
            </div>
            <div class="flex items-center gap-2 mt-4">
                <span id="progress-text" class="font-space text-xs font-medium tabular-nums" style="color: var(--forest-deep);">Loading 0%</span>
                <span class="dot-loader"><span></span><span></span><span></span></span>
            </div>
        </div>

        <div class="absolute bottom-6 font-cinzel text-[10px] font-semibold tracking-[0.4em] uppercase" style="color: var(--maroon);">Curated by Horizon</div>
    </div>

    <!-- ===== Main App ===== -->
    <div class="h-screen w-full flex flex-col relative z-10">

        <!-- ===== Forest Green Heritage Header ===== -->
        <header class="glass-header w-full z-30 px-5 py-4 sm:py-5">
            <div class="relative z-10 flex items-center justify-center gap-5">
                <!-- Gold-framed prominent profile -->
                <div class="profile-wrap shrink-0">
                    <img src="assets/haris-horizon.webp" alt="Haris Horizon"
                         class="w-20 h-20 sm:w-24 sm:h-24 object-cover">
                </div>
                <!-- Title block -->
                <div class="flex flex-col leading-tight">
                    <span class="header-eyebrow text-[9.5px] sm:text-[10.5px] mb-1">Curated By</span>
                    <span class="header-title text-3xl sm:text-4xl">Horizon</span>
                    <span class="header-sub text-[9.5px] sm:text-[10.5px] mt-1">Pharmacognosy · Botanical Heritage</span>
                </div>
            </div>
        </header>

        <!-- ===== 3D Model Viewer ===== -->
        <main class="flex-grow w-full relative model-stage">

            <!-- Botanical specimen taxonomy tag -->
            <div class="specimen-tag">
                <span class="common">Specimen</span>
                <span class="dot"></span>
                <span class="latin">Withania somnifera</span>
            </div>

            <model-viewer
                id="main-viewer"
                src="ashwagandha.glb"
                camera-controls
                touch-action="pan-y"
                shadow-intensity="1.5"
                shadow-softness="1"
                environment-image="neutral"
                exposure="1"
                style="background-color: transparent;"
                class="w-full h-full outline-none"
                alt="A 3D model of Ashwagandha (Withania somnifera)">
            </model-viewer>

            <!-- Tutorial Overlay (parchment glass) -->
            <div id="tutorial-overlay" class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-1000">
                <div class="glass-strong px-8 py-6 flex gap-10">
                    <div class="flex flex-col items-center">
                        <div class="relative w-16 h-16 flex items-center justify-center mb-3 rounded-full"
                             style="background: rgba(232, 245, 233, 0.7); border: 1px solid rgba(15, 76, 42, 0.25);">
                            <div class="w-5 h-5 rounded-full absolute anim-swipe touch-indicator"
                                 style="background: var(--forest-deep);"></div>
                        </div>
                        <span class="font-space text-[11px] font-semibold text-center" style="color: var(--forest-deep);">
                            1 Finger
                            <br><span class="font-manrope font-normal" style="color: var(--maroon);">Drag to Rotate</span>
                        </span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="relative w-16 h-16 flex items-center justify-center mb-3 rounded-full"
                             style="background: rgba(232, 245, 233, 0.7); border: 1px solid rgba(15, 76, 42, 0.25);">
                            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color: var(--forest-deep);">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6M7 10h6"/>
                            </svg>
                        </div>
                        <span class="font-space text-[11px] font-semibold text-center" style="color: var(--forest-deep);">
                            2 Fingers
                            <br><span class="font-manrope font-normal" style="color: var(--maroon);">Pinch to Zoom</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Floating Botanical Controls -->
            <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex items-center gap-5 z-30">
                <button id="reset-btn" class="icon-btn" aria-label="Reset Position">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span class="label">Reset</span>
                </button>

                <button id="auto-rotate-btn" class="icon-btn" aria-label="Auto Rotate">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20 4v5h-.582m0 0a8.001 8.001 0 00-15.356 2m15.356-2H15M4 20v-5h.581m0 0a8.003 8.003 0 0015.357-2M4.581 15H9"/>
                    </svg>
                    <span class="label">Rotate</span>
                </button>
            </div>
        </main>

        <!-- ===== Forest Green Heritage Footer ===== -->
        <footer class="glass-footer w-full z-30 py-3.5 px-6 flex items-center justify-between">
            <span class="footer-label text-[10px] sm:text-[11px]">Ashwagandha · 3D Specimen</span>
            <span class="footer-version text-[10px] sm:text-[11px] tabular-nums">Edition v1.0</span>
        </footer>

    </div>

    <!-- ===== App Logic ===== -->
    <script>
    (() => {
        const viewer  = document.getElementById('main-viewer');
        const splash  = document.getElementById('splash-screen');
        const bar     = document.getElementById('progress-bar');
        const text    = document.getElementById('progress-text');
        const tutorial = document.getElementById('tutorial-overlay');
        const rotateBtn = document.getElementById('auto-rotate-btn');
        const resetBtn  = document.getElementById('reset-btn');

        viewer.addEventListener('progress', (e) => {
            const p = Math.round(e.detail.totalProgress * 100);
            bar.style.width = p + '%';
            text.textContent = `Loading ${p}%`;
        });

        viewer.addEventListener('load', () => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                tutorial.classList.remove('opacity-0');
                tutorial.classList.add('opacity-100');

                const hide = () => {
                    tutorial.classList.add('opacity-0', 'pointer-events-none');
                    tutorial.classList.remove('opacity-100');
                    viewer.removeEventListener('pointerdown', hide);
                    viewer.removeEventListener('camera-change', hide);
                };
                setTimeout(hide, 5000);
                viewer.addEventListener('pointerdown', hide);
                viewer.addEventListener('camera-change', hide);
            }, 700);
        });

        let rotating = false;
        rotateBtn.addEventListener('click', () => {
            rotating = !rotating;
            if (rotating) {
                viewer.setAttribute('auto-rotate', '');
                viewer.setAttribute('auto-rotate-delay', '0');
                viewer.setAttribute('rotation-per-second', '30deg');
                rotateBtn.classList.add('active');
            } else {
                viewer.removeAttribute('auto-rotate');
                rotateBtn.classList.remove('active');
            }
        });

        resetBtn.addEventListener('click', () => {
            viewer.cameraOrbit  = 'auto auto auto';
            viewer.cameraTarget = 'auto auto auto';
            viewer.fieldOfView  = 'auto';
            viewer.jumpCameraToGoal && viewer.jumpCameraToGoal();
            resetBtn.classList.remove('spin-once');
            void resetBtn.offsetWidth;
            resetBtn.classList.add('spin-once');
        });
    })();
    </script>
</body>
</html>

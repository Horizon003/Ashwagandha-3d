<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ashwagandha 3D | Made by Horizon</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: SF-style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-bg-strong: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.45);
            --glass-shadow: 0 8px 32px rgba(31, 38, 135, 0.18);
        }

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        model-viewer::part(default-progress-bar) { display: none; }

        /* ===== Animated colorful background (so glass actually looks glassy) ===== */
        .app-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(circle at 15% 15%, #cfe7ff 0%, transparent 45%),
                radial-gradient(circle at 85% 20%, #ffd8ec 0%, transparent 45%),
                radial-gradient(circle at 75% 85%, #d8f5e2 0%, transparent 45%),
                radial-gradient(circle at 15% 85%, #ffe6c7 0%, transparent 45%),
                linear-gradient(135deg, #f7f8fc 0%, #eef0f7 100%);
        }
        .floating-orb {
            position: absolute;
            border-radius: 9999px;
            filter: blur(70px);
            opacity: 0.55;
            animation: orbFloat 12s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 { width: 320px; height: 320px; background: #b8dcff; top: 5%; left: -80px; animation-delay: 0s; }
        .orb-2 { width: 260px; height: 260px; background: #ffc4dc; top: 30%; right: -60px; animation-delay: -4s; }
        .orb-3 { width: 220px; height: 220px; background: #c9efd6; bottom: 8%; left: 30%; animation-delay: -7s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(40px,-30px) scale(1.12); }
        }

        /* ===== GLASSMORPHISM CORE ===== */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow:
                0 8px 32px rgba(31, 38, 135, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.7);
        }
        .glass-strong {
            background: var(--glass-bg-strong);
            backdrop-filter: blur(28px) saturate(200%);
            -webkit-backdrop-filter: blur(28px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.55);
            box-shadow:
                0 10px 36px rgba(31, 38, 135, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
        }

        /* ===== Header (white strip, black text, glass) ===== */
        .glass-header {
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow:
                0 4px 24px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }
        .header-title {
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #000;
        }
        .header-sub {
            font-weight: 600;
            letter-spacing: 0.22em;
            color: #000;
            opacity: 0.65;
        }

        /* ===== Big Prominent Profile Picture ===== */
        .profile-wrap {
            position: relative;
            border-radius: 9999px;
            padding: 4px;
            background: conic-gradient(from 0deg,
                #ff9bd2, #a3d8ff, #b6f3c8, #ffd8a3, #ff9bd2);
            box-shadow:
                0 0 0 1px rgba(0,0,0,0.06),
                0 0 24px rgba(255,255,255,0.9),
                0 0 40px rgba(180,200,255,0.55),
                0 8px 28px rgba(0,0,0,0.18);
            animation: ringSpin 8s linear infinite;
        }
        @keyframes ringSpin { to { transform: rotate(360deg); } }
        .profile-wrap img {
            display: block;
            border-radius: 9999px;
            background: #fff;
            animation: ringSpinReverse 8s linear infinite;
            border: 3px solid #fff;
        }
        @keyframes ringSpinReverse { to { transform: rotate(-360deg); } }

        /* ===== Splash ===== */
        .splash-bg {
            background:
                radial-gradient(circle at 20% 20%, #ffffff 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, #f0f0f3 0%, transparent 50%),
                linear-gradient(135deg, #fafafa 0%, #ececef 100%);
        }
        .blob {
            position: absolute;
            border-radius: 9999px;
            filter: blur(60px);
            opacity: 0.55;
            animation: blobFloat 8s ease-in-out infinite;
        }
        .blob-1 { width: 280px; height: 280px; background: #c8e6ff; top: 10%; left: -60px; animation-delay: 0s; }
        .blob-2 { width: 220px; height: 220px; background: #ffd6e0; bottom: 12%; right: -40px; animation-delay: -3s; }
        .blob-3 { width: 180px; height: 180px; background: #e0d4ff; top: 45%; left: 50%; animation-delay: -5s; }

        @keyframes blobFloat {
            0%, 100% { transform: translate(0,0) scale(1); }
            50% { transform: translate(30px,-20px) scale(1.1); }
        }

        .splash-logo { animation: logoBounce 2s ease-in-out infinite; }
        @keyframes logoBounce {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }

        .progress-track {
            background: rgba(0,0,0,0.06);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
        }
        .progress-fill {
            background: linear-gradient(90deg, #1a1a1a 0%, #4a4a4a 50%, #1a1a1a 100%);
            background-size: 200% 100%;
            animation: shimmer 1.6s linear infinite;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .dot-loader span {
            display: inline-block;
            width: 6px; height: 6px; margin: 0 2px;
            background: #1a1a1a;
            border-radius: 9999px;
            animation: dotPulse 1.2s ease-in-out infinite;
        }
        .dot-loader span:nth-child(2) { animation-delay: 0.15s; }
        .dot-loader span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotPulse {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1.2); }
        }

        /* ===== Floating Icon Buttons (glass) ===== */
        .icon-btn {
            width: 56px; height: 56px;
            background: rgba(255,255,255,0.45);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255,255,255,0.55);
            box-shadow:
                0 8px 24px rgba(31,38,135,0.18),
                inset 0 1px 0 rgba(255,255,255,0.85);
            border-radius: 9999px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            color: #0a0a0a;
        }
        .icon-btn:hover { transform: scale(1.08); background: rgba(255,255,255,0.65); }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn.active {
            background: rgba(20,20,20,0.78);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow:
                0 8px 24px rgba(0,0,0,0.35),
                0 0 0 4px rgba(255,255,255,0.25),
                inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .icon-btn .label {
            position: absolute;
            bottom: -22px;
            font-size: 10px;
            font-weight: 700;
            color: #111;
            letter-spacing: 0.05em;
            white-space: nowrap;
            opacity: 0.85;
        }

        .spin-once { animation: spinOnce 0.6s ease-out; }
        @keyframes spinOnce {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        /* Tutorial */
        .touch-indicator {
            box-shadow: 0 0 0 0 rgba(0,0,0,0.4);
            animation: pulseRing 2s infinite;
        }
        @keyframes pulseRing {
            0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0,0,0,0.3); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(0,0,0,0); }
            100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0,0,0,0); }
        }
        @keyframes swipeAnim {
            0% { transform: translateX(-20px); }
            50% { transform: translateX(20px); }
            100% { transform: translateX(-20px); }
        }
        .anim-swipe { animation: swipeAnim 2.5s ease-in-out infinite; }

        /* Model stage – transparent so glass background shows through */
        .model-stage {
            background:
                radial-gradient(ellipse at center 80%, rgba(0,0,0,0.06) 0%, transparent 60%);
        }

        /* Footer (glass, white-ish, black text) */
        .glass-footer {
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border-top: 1px solid rgba(255,255,255,0.55);
            box-shadow:
                0 -4px 20px rgba(0,0,0,0.05),
                inset 0 1px 0 rgba(255,255,255,0.85);
        }
    </style>
</head>
<body class="overflow-hidden text-black selection:bg-gray-300">

    <!-- Animated colorful glass background -->
    <div class="app-bg">
        <div class="floating-orb orb-1"></div>
        <div class="floating-orb orb-2"></div>
        <div class="floating-orb orb-3"></div>
    </div>

    <!-- ===== Splash Screen ===== -->
    <div id="splash-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-center splash-bg transition-opacity duration-700 overflow-hidden">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>

        <div class="relative z-10 flex flex-col items-center">
            <div class="splash-logo mb-6">
                <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-white to-gray-200 shadow-[0_10px_40px_rgba(0,0,0,0.15)] flex items-center justify-center border border-white">
                    <svg class="w-10 h-10 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 2C8 6 6 10 6 14a6 6 0 0012 0c0-4-2-8-6-12z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 14v8"></path>
                    </svg>
                </div>
            </div>

            <h1 class="text-3xl mb-1 font-extrabold tracking-tight text-black">Ashwagandha 3D</h1>
            <p class="text-xs text-gray-600 font-semibold tracking-wide mb-8">EXPLORE • ROTATE • DISCOVER</p>

            <div class="w-64 h-[3px] progress-track rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full progress-fill rounded-full" style="width:0%"></div>
            </div>
            <div class="flex items-center gap-2 mt-4">
                <span id="progress-text" class="text-xs font-medium text-gray-700 tabular-nums">Loading 0%</span>
                <span class="dot-loader"><span></span><span></span><span></span></span>
            </div>
        </div>

        <div class="absolute bottom-6 text-[10px] text-gray-500 font-semibold tracking-widest uppercase">Made by Horizon</div>
    </div>

    <!-- ===== Main App ===== -->
    <div class="h-screen w-full flex flex-col relative z-10">

        <!-- ===== Glass Header: White Strip + Black Text + BIG Profile ===== -->
        <header class="glass-header w-full z-30 flex items-center justify-center gap-5 px-5 py-4 sm:py-5">
            <!-- BIG, prominent profile picture -->
            <div class="profile-wrap shrink-0">
                <img src="assets/haris-horizon.webp" alt="Haris Horizon"
                     class="w-20 h-20 sm:w-24 sm:h-24 object-cover">
            </div>
            <!-- Title -->
            <div class="flex flex-col leading-tight">
                <span class="header-sub text-[10px] sm:text-[11px] uppercase">Made by</span>
                <span class="header-title text-3xl sm:text-4xl">Horizon</span>
            </div>
        </header>

        <!-- ===== 3D Model Viewer ===== -->
        <main class="flex-grow w-full relative model-stage">
            <model-viewer
                id="main-viewer"
                src="ashwagandha.glb"
                camera-controls
                touch-action="pan-y"
                shadow-intensity="1.5"
                shadow-softness="1"
                environment-image="neutral"
                exposure="1"
                style="background-color: transparent;"
                class="w-full h-full outline-none"
                alt="A 3D model of Ashwagandha">
            </model-viewer>

            <!-- Tutorial Overlay (glass) -->
            <div id="tutorial-overlay" class="absolute inset-0 z-20 flex items-center justify-center pointer-events-none opacity-0 transition-opacity duration-1000">
                <div class="glass-strong px-8 py-6 rounded-3xl flex gap-10">
                    <div class="flex flex-col items-center">
                        <div class="relative w-16 h-16 flex items-center justify-center mb-3 bg-white/50 backdrop-blur-md rounded-full border border-white/60">
                            <div class="w-5 h-5 bg-black rounded-full absolute anim-swipe touch-indicator"></div>
                        </div>
                        <span class="text-xs font-semibold text-black text-center">1 Finger<br><span class="text-gray-600 font-normal">Drag to Rotate</span></span>
                    </div>
                    <div class="flex flex-col items-center">
                        <div class="relative w-16 h-16 flex items-center justify-center mb-3 bg-white/50 backdrop-blur-md rounded-full border border-white/60">
                            <svg class="w-8 h-8 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6M7 10h6"></path>
                            </svg>
                        </div>
                        <span class="text-xs font-semibold text-black text-center">2 Fingers<br><span class="text-gray-600 font-normal">Pinch to Zoom</span></span>
                    </div>
                </div>
            </div>

            <!-- Floating Glass Icon Controls -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 flex items-center gap-5 z-30">
                <button id="reset-btn" class="icon-btn relative" aria-label="Reset Position">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    <span class="label">Reset</span>
                </button>

                <button id="auto-rotate-btn" class="icon-btn relative" aria-label="Auto Rotate">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M20 4v5h-.582m0 0a8.001 8.001 0 00-15.356 2m15.356-2H15M4 20v-5h.581m0 0a8.003 8.003 0 0015.357-2M4.581 15H9"/>
                    </svg>
                    <span class="label">Rotate</span>
                </button>
            </div>
        </main>

        <!-- ===== Glass Footer ===== -->
        <footer class="glass-footer w-full z-30 py-3 px-6 flex items-center justify-between">
            <span class="text-[10px] sm:text-xs font-bold text-black tracking-wider uppercase">Ashwagandha · 3D Model</span>
            <span class="text-[10px] sm:text-xs font-semibold text-gray-700 tabular-nums">v1.0.0</span>
        </footer>

    </div>

    <!-- ===== App Logic ===== -->
    <script>
    (() => {
        const viewer = document.getElementById('main-viewer');
        const splash = document.getElementById('splash-screen');
        const bar = document.getElementById('progress-bar');
        const text = document.getElementById('progress-text');
        const tutorial = document.getElementById('tutorial-overlay');
        const rotateBtn = document.getElementById('auto-rotate-btn');
        const resetBtn = document.getElementById('reset-btn');

        viewer.addEventListener('progress', (e) => {
            const p = Math.round(e.detail.totalProgress * 100);
            bar.style.width = p + '%';
            text.textContent = `Loading ${p}%`;
        });

        viewer.addEventListener('load', () => {
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                tutorial.classList.remove('opacity-0');
                tutorial.classList.add('opacity-100');

                const hide = () => {
                    tutorial.classList.add('opacity-0', 'pointer-events-none');
                    tutorial.classList.remove('opacity-100');
                    viewer.removeEventListener('pointerdown', hide);
                    viewer.removeEventListener('camera-change', hide);
                };
                setTimeout(hide, 5000);
                viewer.addEventListener('pointerdown', hide);
                viewer.addEventListener('camera-change', hide);
            }, 700);
        });

        let rotating = false;
        rotateBtn.addEventListener('click', () => {
            rotating = !rotating;
            if (rotating) {
                viewer.setAttribute('auto-rotate', '');
                viewer.setAttribute('auto-rotate-delay', '0');
                viewer.setAttribute('rotation-per-second', '30deg');
                rotateBtn.classList.add('active');
            } else {
                viewer.removeAttribute('auto-rotate');
                rotateBtn.classList.remove('active');
            }
        });

        resetBtn.addEventListener('click', () => {
            viewer.cameraOrbit = 'auto auto auto';
            viewer.cameraTarget = 'auto auto auto';
            viewer.fieldOfView = 'auto';
            viewer.jumpCameraToGoal && viewer.jumpCameraToGoal();
            resetBtn.classList.remove('spin-once');
            void resetBtn.offsetWidth;
            resetBtn.classList.add('spin-once');
        });
    })();
    </script>
</body>
</html>

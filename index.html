<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Viewer</title>

<style>
body { margin:0; background:#fff; overflow:hidden; }
.loader {
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%,-50%);
  color:#555;
}
</style>
</head>

<body>

<div class="loader">Loading Model...</div>

<!-- MODEL VIEWER (NO CDN ISSUES) -->
<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<model-viewer 
  src="ashwagandha.glb"
  camera-controls
  auto-rotate
  disable-zoom="false"
  style="width:100vw;height:100vh;"
  onload="document.querySelector('.loader').style.display='none'">
</model-viewer>

</body>
</html>
